name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # lets you run it by hand from the Actions tab

jobs:
  test:
    name: GHC ${{ matrix.ghc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ghc: ['9.6', '9.8']

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Install GHC and cabal
        uses: haskell-actions/setup@v2
        id: setup
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: latest
          cabal-update: true

      - name: Configure (enable tests)
        run: cabal configure --enable-tests

      - name: Compute the build plan
        run: cabal build all --dry-run

      # Dependencies (QuickCheck, bytestring, ...) are cached between runs,
      # keyed on the build plan, so they are only rebuilt when they change.
      - name: Restore dependency cache
        uses: actions/cache/restore@v4
        id: cache
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-${{ hashFiles('**/plan.json') }}
          restore-keys: ${{ runner.os }}-ghc-${{ steps.setup.outputs.ghc-version }}-

      - name: Build dependencies
        run: cabal build all --only-dependencies

      - name: Save dependency cache
        uses: actions/cache/save@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          path: ${{ steps.setup.outputs.cabal-store }}
          key: ${{ steps.cache.outputs.cache-primary-key }}

      - name: Build
        run: cabal build all

      - name: Run tests
        run: cabal test all --test-show-details=direct
